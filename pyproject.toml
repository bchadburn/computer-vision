[project]
name = "computer-vision"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.12",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indoor_outdoor"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]
